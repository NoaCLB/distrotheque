cgi.fix_pathinfo=0
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
allow_url_fopen=Off
allow_url_include=Off
file_uploads=On
upload_max_filesize=100M
post_max_size=512M
max_file_uploads=20
max_execution_time=300
max_input_time=300
open_basedir=/var/www/distrotheque/:/tmp/
disable_functions=passthru,shell_exec,system,proc_open,pcntl_exec,pcntl_fork,pcntl_signal,dl
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax
