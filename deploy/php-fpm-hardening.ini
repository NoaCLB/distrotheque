cgi.fix_pathinfo=0
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
allow_url_fopen=Off
allow_url_include=Off
file_uploads=Off
open_basedir=/var/www/distrotheque/:/tmp/
disable_functions=passthru,shell_exec,system,proc_open,pcntl_exec,pcntl_fork,pcntl_signal,dl
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax
